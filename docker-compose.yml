# Local development services. Fake dev passwords only. Ports are bound to loopback.
# NOT VERIFIED: Docker is not available in the build sandbox. scripts/dev-services.sh is the
# tested alternative (same PostgreSQL 16 and Redis 7, same ACL file).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qs_admin
      POSTGRES_PASSWORD: qs_admin_dev_pw
      POSTGRES_DB: qs_dev
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qs_admin -d qs_dev']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    command:
      - redis-server
      - /etc/redis/redis-dev.conf
      - --aclfile
      - /etc/redis/users.dev.acl
    volumes:
      - ./infrastructure/redis/redis-dev.conf:/etc/redis/redis-dev.conf:ro
      - ./infrastructure/redis/users.dev.acl:/etc/redis/users.dev.acl:ro
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test:
        ['CMD', 'redis-cli', '--user', 'ops', '--pass', 'devpass-ops', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
